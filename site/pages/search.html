<!doctype html>
<html lang="ja" data-repo-root="../../" data-surface-id="site-search">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Web Project Guide のOwner Docs、Current Requirements、Human Guide、Catalogを横断して検索します。">
  <title>サイト全体検索 · Web Project Guide</title>
  <link rel="stylesheet" href="../assets/human-guide.css">
  <link rel="stylesheet" href="../assets/mobile-fixes.css">
  <style>
    .search-shell{max-width:980px;margin:0 auto}.search-panel{margin-top:24px;padding:18px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}.search-row{display:grid;grid-template-columns:minmax(0,1fr) 190px 190px;gap:10px}.search-row input,.search-row select{min-height:46px;width:100%;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font:inherit;padding:0 13px}.search-row input:focus-visible,.search-row select:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 34%,transparent);outline-offset:2px}.search-help,.search-status{color:var(--muted);font-size:13px}.search-help kbd{display:inline-block;min-width:24px;padding:1px 5px;border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;background:var(--surface-2);color:var(--text);font:11px ui-monospace,SFMono-Regular,Consolas,monospace;text-align:center}.search-status{margin:14px 0 0}.results{display:grid;gap:10px;margin-top:18px}.result{padding:16px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}.result-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.result h2{margin:0;font-size:18px}.result a{color:var(--text);text-decoration:none}.result a:hover,.result a:focus-visible{color:var(--accent);text-decoration:underline}.result-badges{display:flex;flex:0 0 auto;flex-wrap:wrap;justify-content:flex-end;gap:6px}.authority,.content-type{border:1px solid var(--border);border-radius:999px;padding:3px 8px;color:var(--muted);font-size:11px;font-weight:700;white-space:nowrap}.content-type{background:var(--surface-2)}.result p{margin:9px 0 0;color:var(--muted);font-size:13px;line-height:1.7}.result-path{margin-top:9px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;overflow-wrap:anywhere}.empty{padding:26px;border:1px dashed var(--border);border-radius:10px;color:var(--muted);text-align:center}.quick-links{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.quick-links a{border:1px solid var(--border);border-radius:999px;padding:7px 10px;color:var(--text);font-size:12px;text-decoration:none}.release-note{margin-top:14px;color:var(--muted);font-size:12px}@media(max-width:860px){.search-row{grid-template-columns:1fr 1fr}.search-row label:first-child{grid-column:1/-1}}@media(max-width:620px){.search-row{grid-template-columns:1fr}.search-row label:first-child{grid-column:auto}.result-top{display:block}.result-badges{justify-content:flex-start;margin-top:8px}}
  </style>
</head>
<body>
  <header class="sitebar">
    <div class="sitebar-inner">
      <a class="brand" data-human-guide-home href="../../index.html">Web Project Guide</a>
      <nav class="tabs" data-human-guide-nav aria-label="Guide navigation"></nav>
    </div>
  </header>

  <main class="container" id="main-content">
    <div class="search-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">SITE-WIDE SEARCH</p>
          <h1>正本・要約・Catalogを区別して探す。</h1>
          <p class="lead">Owner Docs、Current Requirements、Human Guideの入口、Catalogを横断します。Privateな <code>web-project-data</code> は検索対象に含めません。</p>
        </div>
      </header>

      <section class="search-panel" aria-labelledby="search-title">
        <h2 id="search-title">検索</h2>
        <div class="search-row">
          <label>
            <span class="visually-hidden">検索語</span>
            <input id="query" type="search" autocomplete="off" aria-keyshortcuts="/ Control+K Meta+K" placeholder="例: 保存、Navigation、Research、Electron">
          </label>
          <label>
            <span class="visually-hidden">正本種別で絞り込む</span>
            <select id="authority">
              <option value="">すべての正本種別</option>
              <option value="normative-owner">Owner / 正本</option>
              <option value="current-contract">Requirements / Current Contract</option>
              <option value="human-summary">Human Guide / 要約</option>
              <option value="status">Status / 状態</option>
              <option value="catalog-example">Catalog / 実例</option>
            </select>
          </label>
          <label>
            <span class="visually-hidden">Content Typeで絞り込む</span>
            <select id="contentType">
              <option value="">すべてのContent Type</option>
              <option value="owner-doc">Owner Doc</option>
              <option value="requirements">Requirements</option>
              <option value="human-page">Human Guide Page</option>
              <option value="entry-doc">Entry / Router Doc</option>
              <option value="catalog">Catalog</option>
            </select>
          </label>
        </div>
        <p class="search-help">Authorityは「どれが正本か」、Content Typeは「何の種類か」を表します。<kbd>/</kbd> または <kbd>Ctrl/⌘ K</kbd> で検索欄へ移動できます。</p>
        <p id="status" class="search-status" role="status" aria-live="polite">2文字以上入力すると検索します。</p>
      </section>

      <div class="quick-links" aria-label="検索以外の入口">
        <a href="task-router.html">作業ルート診断</a>
        <a href="rules.html">機能・困りごとから探す</a>
        <a href="all-rules.html">全ルール短縮版</a>
      </div>

      <section id="results" class="results" aria-label="検索結果"></section>
      <p class="release-note" data-guide-release></p>
    </div>
  </main>

  <script src="../assets/human-guide-shell.js"></script>
  <script>
    const queryInput = document.querySelector('#query');
    const authoritySelect = document.querySelector('#authority');
    const contentTypeSelect = document.querySelector('#contentType');
    const results = document.querySelector('#results');
    const status = document.querySelector('#status');
    const sourceUrl = new URL('../data/search-sources.json', location.href);
    const repoRoot = new URL('../../', location.href);
    const githubBase = 'https://github.com/EliteMay/web-project-guide/blob/main/';

    const authorityLabels = {
      'normative-owner': 'Owner / 正本',
      'current-contract': 'Current Contract',
      'human-summary': 'Human Guide / 要約',
      'status': 'Status / 状態',
      'catalog-example': 'Catalog / 実例'
    };

    const contentTypeLabels = {
      'requirements': 'Requirements',
      'entry-doc': 'Entry / Router Doc',
      'human-page': 'Human Guide Page',
      'owner-doc': 'Owner Doc',
      'catalog': 'Catalog'
    };

    let sources = [];
    let loadPromise = null;

    function normalize(value) {
      return String(value || '').normalize('NFKC').toLocaleLowerCase('ja');
    }

    function stripSource(value) {
      return String(value || '')
        .replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, ' ')
        .replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, ' ')
        .replace(/<[^>]+>/g, ' ')
        .replace(/&nbsp;|&#160;/gi, ' ')
        .replace(/&amp;/gi, '&')
        .replace(/&lt;/gi, '<')
        .replace(/&gt;/gi, '>')
        .replace(/&quot;/gi, '"')
        .replace(/&#39;|&apos;/gi, "'")
        .replace(/```[\s\S]*?```/g, ' ')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/!\[[^\]]*\]\([^)]*\)/g, ' ')
        .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
        .replace(/^#{1,6}\s+/gm, '')
        .replace(/[>*_~|]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function sourceHref(source) {
      if (source.destination) return new URL(source.destination, repoRoot).href;
      return githubBase + source.path.split('/').map(encodeURIComponent).join('/');
    }

    function makeSnippet(text, query) {
      const clean = stripSource(text);
      if (!clean) return '本文を読み込めなかったため、Title / Keywordだけで検索しています。';
      const haystack = normalize(clean);
      const needle = normalize(query);
      const index = haystack.indexOf(needle);
      const start = index >= 0 ? Math.max(0, index - 70) : 0;
      const snippet = clean.slice(start, start + 230);
      return `${start > 0 ? '…' : ''}${snippet}${start + 230 < clean.length ? '…' : ''}`;
    }

    async function loadSources() {
      if (loadPromise) return loadPromise;
      loadPromise = (async () => {
        const response = await fetch(sourceUrl);
        if (!response.ok) throw new Error(`search source list ${response.status}`);
        const data = await response.json();
        sources = data.sources || [];

        await Promise.all(sources.map(async (source) => {
          try {
            const response = await fetch(new URL(source.path, repoRoot));
            source.content = response.ok ? await response.text() : '';
          } catch {
            source.content = '';
          }
          source.searchText = normalize([
            source.title,
            ...(source.keywords || []),
            stripSource(source.content)
          ].join(' '));
        }));
      })();
      return loadPromise;
    }

    function score(source, query) {
      const q = normalize(query);
      const title = normalize(source.title);
      const keywords = normalize((source.keywords || []).join(' '));
      let value = 0;
      if (title === q) value += 30;
      if (title.includes(q)) value += 16;
      if (keywords.includes(q)) value += 10;
      if (source.searchText.includes(q)) value += 4;
      const occurrences = source.searchText.split(q).length - 1;
      return value + Math.min(occurrences, 8);
    }

    function renderMatches(query) {
      const selectedAuthority = authoritySelect.value;
      const selectedContentType = contentTypeSelect.value;
      const matches = sources
        .filter((source) => !selectedAuthority || source.authority === selectedAuthority)
        .filter((source) => !selectedContentType || source.contentType === selectedContentType)
        .filter((source) => source.searchText.includes(normalize(query)))
        .map((source) => ({ source, score: score(source, query) }))
        .sort((a, b) => b.score - a.score || a.source.title.localeCompare(b.source.title, 'ja'))
        .slice(0, 30);

      results.replaceChildren();
      if (!matches.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.innerHTML = '一致する公開Guide資産がありません。検索語やFilterを緩めるか、<a href="task-router.html">作業ルート診断</a>を使ってください。';
        results.append(empty);
        status.textContent = '0件';
        return;
      }

      for (const { source } of matches) {
        const article = document.createElement('article');
        article.className = 'result';
        const top = document.createElement('div');
        top.className = 'result-top';
        const heading = document.createElement('h2');
        const link = document.createElement('a');
        link.href = sourceHref(source);
        link.textContent = source.title;
        heading.append(link);

        const badges = document.createElement('div');
        badges.className = 'result-badges';
        const authority = document.createElement('span');
        authority.className = 'authority';
        authority.textContent = authorityLabels[source.authority] || source.authority;
        const contentType = document.createElement('span');
        contentType.className = 'content-type';
        contentType.textContent = contentTypeLabels[source.contentType] || source.contentType;
        badges.append(authority, contentType);

        top.append(heading, badges);
        const snippet = document.createElement('p');
        snippet.textContent = makeSnippet(source.content, query);
        const path = document.createElement('div');
        path.className = 'result-path';
        path.textContent = source.path;
        article.append(top, snippet, path);
        results.append(article);
      }

      status.textContent = `${matches.length}件表示`;
    }

    function updateUrlState(query) {
      const params = new URLSearchParams(location.search);
      if (query) params.set('q', query); else params.delete('q');
      if (authoritySelect.value) params.set('authority', authoritySelect.value); else params.delete('authority');
      if (contentTypeSelect.value) params.set('type', contentTypeSelect.value); else params.delete('type');
      history.replaceState(null, '', `${location.pathname}${params.size ? `?${params}` : ''}${location.hash}`);
    }

    async function runSearch() {
      const query = queryInput.value.trim();
      updateUrlState(query);

      if (normalize(query).length < 2) {
        results.replaceChildren();
        status.textContent = '2文字以上入力すると検索します。';
        return;
      }

      status.textContent = '公開Guide資産を読み込んでいます…';
      try {
        await loadSources();
        renderMatches(query);
      } catch (error) {
        console.error(error);
        results.innerHTML = '<div class="empty">検索Indexを読み込めませんでした。<a href="rules.html">ルール検索</a>または<a href="../../START_HERE.md">START HERE</a>を使ってください。</div>';
        status.textContent = '検索を利用できません';
      }
    }

    function focusSearch() {
      queryInput.focus();
      queryInput.select();
    }

    function isTextEntry(target) {
      return target instanceof HTMLInputElement ||
        target instanceof HTMLTextAreaElement ||
        target instanceof HTMLSelectElement ||
        target?.isContentEditable === true;
    }

    let timer;
    queryInput.addEventListener('input', () => {
      clearTimeout(timer);
      timer = setTimeout(runSearch, 120);
    });
    authoritySelect.addEventListener('change', runSearch);
    contentTypeSelect.addEventListener('change', runSearch);

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLocaleLowerCase();
      if ((event.ctrlKey || event.metaKey) && key === 'k') {
        event.preventDefault();
        focusSearch();
        return;
      }
      if (event.key === '/' && !event.ctrlKey && !event.metaKey && !event.altKey && !isTextEntry(event.target)) {
        event.preventDefault();
        focusSearch();
      }
    });

    const initialParams = new URLSearchParams(location.search);
    const initialQuery = initialParams.get('q') || '';
    const initialAuthority = initialParams.get('authority') || '';
    const initialType = initialParams.get('type') || '';
    queryInput.value = initialQuery;
    if ([...authoritySelect.options].some((option) => option.value === initialAuthority)) authoritySelect.value = initialAuthority;
    if ([...contentTypeSelect.options].some((option) => option.value === initialType)) contentTypeSelect.value = initialType;
    if (initialQuery) runSearch();
  </script>
</body>
</html>
