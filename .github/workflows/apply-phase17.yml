name: Apply Phase 17

on:
  push:
    branches:
      - guide/phase-17-measurement-experimentation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: guide/phase-17-measurement-experimentation

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Phase 17
        run: node .github/scripts/apply-phase17.mjs

      - name: Remove temporary helper
        run: rm .github/scripts/apply-phase17.mjs .github/workflows/apply-phase17.yml

      - name: Validate guide
        run: node tests/validate-guide.mjs

      - name: Commit integrated docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Integrate Phase 17 measurement rules"
          git push origin HEAD:guide/phase-17-measurement-experimentation
