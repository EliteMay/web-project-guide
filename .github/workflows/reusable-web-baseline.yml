name: Reusable Web Baseline

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used for syntax and JSON checks
        required: false
        type: string
        default: '22'
      syntax-paths:
        description: Space-separated repository paths to scan for .js and .mjs syntax
        required: false
        type: string
        default: '.'
      check-json:
        description: Parse committed JSON files outside excluded build/dependency directories
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: JavaScript syntax baseline
        shell: bash
        env:
          SYNTAX_PATHS: ${{ inputs.syntax-paths }}
        run: |
          set -uo pipefail
          failed=0
          for root in $SYNTAX_PATHS; do
            if [ ! -e "$root" ]; then
              echo "Skip missing syntax path: $root"
              continue
            fi
            while IFS= read -r -d '' file; do
              echo "Checking $file"
              if ! node --check "$file"; then
                failed=1
              fi
            done < <(find "$root" -type f \( -name '*.js' -o -name '*.mjs' \) \
              -not -path '*/.git/*' \
              -not -path '*/node_modules/*' \
              -not -path '*/dist/*' \
              -not -path '*/build/*' \
              -print0)
          done
          exit "$failed"

      - name: JSON parse baseline
        if: ${{ inputs.check-json }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const excluded = new Set(['.git', 'node_modules', 'dist', 'build']);
          const failures = [];

          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.isDirectory() && excluded.has(entry.name)) continue;
              const full = path.join(dir, entry.name);
              if (entry.isDirectory()) walk(full);
              else if (entry.isFile() && entry.name.endsWith('.json')) {
                try {
                  JSON.parse(fs.readFileSync(full, 'utf8'));
                } catch (error) {
                  failures.push(`${full}: ${error.message}`);
                }
              }
            }
          }

          walk('.');
          if (failures.length) {
            console.error('JSON parse baseline failed:');
            for (const failure of failures) console.error(`- ${failure}`);
            process.exit(1);
          }
          console.log('JSON parse baseline passed.');
          NODE
