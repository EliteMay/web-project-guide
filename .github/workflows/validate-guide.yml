name: Validate Guide

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Validate guide structure and links
        run: node tests/validate-guide.mjs

      - name: Test release lifecycle integrity
        run: node tests/test-release-integrity.mjs

      - name: Validate release current-state integrity
        env:
          RELEASE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tests/validate-release-integrity.mjs

      - name: Validate exhaustive audit contracts
        run: node tests/validate-audit-contract.mjs

      - name: Validate data storage contracts
        run: node tests/validate-data-storage-contract.mjs

      - name: Validate human guide routes
        run: node tests/validate-human-guide.mjs

      - name: Validate development conversation persistence
        run: node tests/validate-development-conversation-persistence.mjs

      - name: Validate root-cause failure workflow
        run: node tests/validate-root-cause-workflow.mjs

      - name: Validate project dashboard queue rendering
        run: node tests/validate-project-dashboard-queue.mjs
