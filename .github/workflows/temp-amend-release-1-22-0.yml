name: Temporary Amend Guide 1.22.0 Release

on:
  push:
    branches:
      - guide/release-1.22.0

permissions:
  contents: write

jobs:
  amend-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preserve concurrent research in release notes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          anchor = "- READMEへ人間向け公開Guide URLを追加し、正式Rule本文のSource of TruthがRepository `docs/`である境界を維持\n\n### Validation / Integration"
          replacement = "- READMEへ人間向け公開Guide URLを追加し、正式Rule本文のSource of TruthがRepository `docs/`である境界を維持\n\n### Concurrent Research Preservation\n\n- reinforcement closure後にmainへ追加された `references/research-capture-policy.md` と `references/rule-application-reliability-research.md` を、active / non-normative research evidenceとして保持\n- High-recall Research CaptureとRule Application Reliabilityの調査は本ReleaseでCommon RuleへPromotionせず、adoption / rejectionは今後のRequirements discussionとEvidenceで決める\n- このactive researchは40-point Content Depth backlogの再オープンを意味せず、Current Routing / Owner / Gate / Profileを変更しない\n\n### Validation / Integration"
          if anchor not in text:
              raise SystemExit('CHANGELOG anchor not found')
          changelog.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          report = Path('作業報告書.md')
          text = report.read_text(encoding='utf-8')
          anchor = "### Remaining\n\n- 40-point Content Depth Audit由来のActive reinforcement candidate: **None**\n- 将来の新Gapは、文字量ではなく実ProjectのFailure / Requirement / Current Evidenceから再監査する"
          replacement = "### Remaining\n\n- 40-point Content Depth Audit由来のActive reinforcement candidate: **None**\n- `references/rule-application-reliability-research.md`は別系統のactive / non-normative research。Common RuleへのPromotion / rejectionは未決定で、40-point Content Depth backlogとは分離して扱う\n- `references/research-capture-policy.md`はそのResearch knowledgeを高recallで保存するためのnon-normative process evidenceであり、Current Ruleを直接変更しない\n- 将来の新Gapは、文字量ではなく実ProjectのFailure / Requirement / Current Evidenceから再監査する"
          if anchor not in text:
              raise SystemExit('work report anchor not found')
          report.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/temp-amend-release-1-22-0.yml
      - name: Validate final release state
        run: |
          node tests/validate-guide.mjs
          git diff --check
      - name: Commit amended release state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve concurrent research in Guide 1.22.0 notes"
          git push
