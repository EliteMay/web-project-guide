name: Apply Phase 15 Integration

on:
  push:
    branches: [guide/phase-15-accessibility-i18n]
    paths:
      - '.github/scripts/apply-phase15.mjs'
      - '.github/workflows/apply-phase15.yml'

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase15-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: guide/phase-15-accessibility-i18n
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Apply Phase 15 integration
        run: node .github/scripts/apply-phase15.mjs

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/04-ui-ux-accessibility.md docs/07-testing-quality.md templates/QUALITY_CHECKLIST.md 作業報告書.md
          git commit -m 'Integrate Phase 15 accessibility and i18n rules [phase15-applied]'
          git push origin HEAD:guide/phase-15-accessibility-i18n
