name: Temporary Project Profile Reinforcement

on:
  push:
    branches:
      - "guide/reinforce-project-profiles"

permissions:
  contents: write

jobs:
  reinforce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply Project Profile reinforcement
        run: python maintenance/scripts/temp-reinforce-project-profiles.py

      - name: Remove temporary patch assets
        run: |
          rm maintenance/scripts/temp-reinforce-project-profiles.py
          rm .github/workflows/temp-reinforce-project-profiles.yml

      - name: Validate final state
        run: |
          node tests/validate-guide.mjs
          git diff --check

      - name: Commit reinforced guide state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Reinforce Project Profile decision depth"
          git push origin HEAD:${GITHUB_REF_NAME}
