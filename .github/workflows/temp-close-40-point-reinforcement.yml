name: Temporary 40 Point Reinforcement Closure

on:
  push:
    branches:
      - "guide/close-40-point-reinforcement"

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Sync checkpoint to merged main
        run: python maintenance/scripts/temp-close-40-point-reinforcement.py
      - name: Remove temporary assets
        run: |
          rm maintenance/scripts/temp-close-40-point-reinforcement.py
          rm .github/workflows/temp-close-40-point-reinforcement.yml
      - name: Validate final state
        run: |
          node tests/validate-guide.mjs
          git diff --check
      - name: Commit closure state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Close 40-point reinforcement backlog"
          git push origin HEAD:${GITHUB_REF_NAME}
