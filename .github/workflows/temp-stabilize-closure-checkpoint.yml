name: Temporary Stable Closure Checkpoint

on:
  push:
    branches:
      - "guide/close-40-point-reinforcement"

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stabilize closure wording
        run: python maintenance/scripts/temp-stabilize-closure-checkpoint.py
      - name: Remove temporary assets
        run: |
          rm maintenance/scripts/temp-stabilize-closure-checkpoint.py
          rm .github/workflows/temp-stabilize-closure-checkpoint.yml
      - name: Validate final state
        run: |
          node tests/validate-guide.mjs
          git diff --check
      - name: Commit stable checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Stabilize reinforcement completion checkpoint"
          git push origin HEAD:${GITHUB_REF_NAME}
