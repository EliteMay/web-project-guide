name: Temporary Profile Backlog Cleanup

on:
  push:
    branches:
      - "guide/reinforce-project-profiles"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Apply backlog cleanup
        run: python maintenance/scripts/temp-profile-backlog-cleanup.py
      - name: Remove temporary assets
        run: |
          rm maintenance/scripts/temp-profile-backlog-cleanup.py
          rm .github/workflows/temp-profile-backlog-cleanup.yml
      - name: Validate final state
        run: |
          node tests/validate-guide.mjs
          git diff --check
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Align reinforced profile backlog state"
          git push origin HEAD:${GITHUB_REF_NAME}
